AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Robot Vacuum Simulator - per-campaign compute (requirement 5.5). An isolated VPC and an AWS Batch
  compute environment that scales EC2 nodes from 0 up to MaxVCpus while jobs are queued and back to 0
  when they finish. vacuumctl creates this stack before a campaign and deletes it afterwards, so no
  infrastructure is left behind.

Parameters:
  ProjectName:
    Type: String
    Default: robot-vacuum-sim
  ImageUri:
    Type: String
    Description: Headless node image, e.g. 123456789012.dkr.ecr.us-east-2.amazonaws.com/robot-vacuum-sim-headless:latest
  ResultsBucketName:
    Type: String
  ProvisioningModel:
    Type: String
    Default: SPOT
    AllowedValues: [SPOT, EC2]
    Description: SPOT is ~60-70% cheaper; interrupted nodes are retried and resume where they stopped. EC2 = on-demand.
  MaxVCpus:
    Type: Number
    Default: 32
    MinValue: 1
    Description: Upper bound on vCPUs running at once. Each node (array child) uses JobVCpus.
  InstanceTypes:
    Type: CommaDelimitedList
    Default: "c6i.large,c6i.xlarge,c7i.large,c7i.xlarge,m6i.large"
  JobVCpus:
    Type: Number
    Default: 1
  JobMemoryMiB:
    Type: Number
    Default: 1800
  JobTimeoutSeconds:
    Type: Number
    Default: 21600
    Description: Hard limit per node attempt; AWS Batch kills the container after this (forced teardown).
  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 180, 365]

Conditions:
  IsSpot: !Equals [!Ref ProvisioningModel, SPOT]

Resources:
  # ------------------------------------------------------------------ network (no NAT: nodes get public IPs, no inbound rules)
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{Key: Name, Value: !Sub "${ProjectName}-batch"}, {Key: Project, Value: !Ref ProjectName}]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{Key: Project, Value: !Ref ProjectName}]

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.0.0/20
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags: [{Key: Name, Value: !Sub "${ProjectName}-a"}]

  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.16.0/20
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags: [{Key: Name, Value: !Sub "${ProjectName}-b"}]

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetARoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref SubnetA, RouteTableId: !Ref RouteTable}

  SubnetBRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref SubnetB, RouteTableId: !Ref RouteTable}

  NodeSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Headless simulator nodes - outbound only (S3, ECR, CloudWatch). No inbound access.
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - {IpProtocol: "-1", CidrIp: 0.0.0.0/0}

  # ------------------------------------------------------------------ IAM (narrowly scoped, C.12 / 4.8)
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - {Effect: Allow, Principal: {Service: ec2.amazonaws.com}, Action: sts:AssumeRole}
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role"

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  JobRole:
    Type: AWS::IAM::Role
    Properties:
      Description: The headless container may read job files and write results under campaigns/ in the results bucket, nothing else.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - {Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: sts:AssumeRole}
      Policies:
        - PolicyName: campaign-data
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub "arn:${AWS::Partition}:s3:::${ResultsBucketName}/campaigns/*"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub "arn:${AWS::Partition}:s3:::${ResultsBucketName}"
                Condition:
                  StringLike:
                    s3:prefix: "campaigns/*"

  # ------------------------------------------------------------------ AWS Batch
  ComputeEnvironment:
    Type: AWS::Batch::ComputeEnvironment
    Properties:
      Type: MANAGED
      State: ENABLED
      ComputeResources:
        Type: !Ref ProvisioningModel
        AllocationStrategy: !If [IsSpot, SPOT_PRICE_CAPACITY_OPTIMIZED, BEST_FIT_PROGRESSIVE]
        MinvCpus: 0
        MaxvCpus: !Ref MaxVCpus
        InstanceTypes: !Ref InstanceTypes
        Subnets: [!Ref SubnetA, !Ref SubnetB]
        SecurityGroupIds: [!Ref NodeSecurityGroup]
        InstanceRole: !GetAtt InstanceProfile.Arn
        Ec2Configuration:
          - ImageType: ECS_AL2023
        Tags:
          Project: !Ref ProjectName
          Name: !Sub "${ProjectName}-node"

  JobQueue:
    Type: AWS::Batch::JobQueue
    Properties:
      JobQueueName: !Sub "${ProjectName}-queue"
      State: ENABLED
      Priority: 1
      ComputeEnvironmentOrder:
        - Order: 1
          ComputeEnvironment: !Ref ComputeEnvironment

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/${ProjectName}/batch"
      RetentionInDays: !Ref LogRetentionDays

  JobDefinition:
    Type: AWS::Batch::JobDefinition
    Properties:
      JobDefinitionName: !Sub "${ProjectName}-headless"
      Type: container
      PlatformCapabilities: [EC2]
      PropagateTags: true
      Tags:
        Project: !Ref ProjectName
      Parameters:
        jobUri: "s3://unset/job.json"
        outputUri: "s3://unset/shards"
      ContainerProperties:
        Image: !Ref ImageUri
        JobRoleArn: !GetAtt JobRole.Arn
        Command: ["--job-uri", "Ref::jobUri", "--output-uri", "Ref::outputUri"]
        ResourceRequirements:
          - {Type: VCPU, Value: !Ref JobVCpus}
          - {Type: MEMORY, Value: !Ref JobMemoryMiB}
        Environment:
          - {Name: VACUUM_SYNC_SECONDS, Value: "15"}
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group: !Ref LogGroup
            awslogs-region: !Ref AWS::Region
            awslogs-stream-prefix: node
      Timeout:
        AttemptDurationSeconds: !Ref JobTimeoutSeconds
      RetryStrategy:
        Attempts: 3
        EvaluateOnExit:
          - {OnExitCode: "2", Action: EXIT}      # job file rejected: retrying can't help
          - {OnStatusReason: "Host EC2*", Action: RETRY}  # Spot reclaimed the node
          - {OnReason: "*", Action: RETRY}

Outputs:
  JobQueueArn:
    Value: !Ref JobQueue
  JobDefinitionArn:
    Value: !Ref JobDefinition
  ComputeEnvironmentArn:
    Value: !Ref ComputeEnvironment
  LogGroupName:
    Value: !Ref LogGroup
